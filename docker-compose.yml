services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env.docker
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # one-shot: runs Alembic migrations, then exits
  migrate:
    build: .
    env_file: .env.docker
    command: alembic upgrade head
    depends_on:
      db:
        condition: service_healthy

  backend:
    build: .
    restart: unless-stopped
    env_file: .env.docker
    expose:
      - "8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  # Celery worker: runs save_click_analytics (called from main.py with .delay)
  # If your Celery instance lives somewhere else, change "app.service.task".
  worker:
    build: .
    restart: unless-stopped
    env_file: .env.docker
    command: celery -A app.service.task worker --loglevel=info
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  frontend:
    build: ./urlfrontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  pgdata:
  redisdata: