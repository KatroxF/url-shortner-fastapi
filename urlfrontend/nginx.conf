# Use the protocol sent by the host nginx (https), fall back to $scheme if absent
map $http_x_forwarded_proto $fwd_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # 1) API calls -> backend (strips the /api prefix)
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
    }

    # 2) Hashed build assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 3) Frontend pages (React Router routes from App.jsx).
    #    If you add a new <Route> in React, add its path here too.
    location = / { try_files /index.html =404; }
    location ~ ^/(login|signup|dashboard|oauth/callback|resend-verification|forgot-password|reset-password)/?$ {
        try_files /index.html =404;
    }

    # 4) Everything else is treated as a short code: /abc123 -> backend redirect
    location / {
        try_files $uri @backend;
    }

    location @backend {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
    }
}